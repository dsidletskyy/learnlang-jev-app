name: language-learning-personal
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: language_learning
      POSTGRES_DB: language_learning
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - personal_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U language_learning -d language_learning']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  personal_data:
